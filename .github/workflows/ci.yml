name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test_lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth for Node — matches the release workflow so a
          # green CI can't hide a publish-time Node mismatch.
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test

      - name: Build Project
        run: pnpm run build

      - name: Assert tracked sources are not mutated by the build
        # The optimize step rewrites SVGs in place and the font generator may
        # rewrite codepoints.json. A clean checkout that has already been
        # optimized must produce a no-op; any diff means an un-optimized SVG or
        # a new icon's codepoint was committed without running `pnpm generate`.
        run: |
          git diff --exit-code -- \
            packages/icons-svg/svg \
            packages/icons-svg/metadata/codepoints.json \
          || (echo "::error::Build mutated tracked source files. Run 'pnpm generate' locally and commit the result." && exit 1)
