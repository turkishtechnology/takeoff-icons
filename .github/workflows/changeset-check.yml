name: Changeset Check

# Fail PRs that touch publishable code without a corresponding changeset, so
# nothing accidentally ships without a CHANGELOG entry — and so designers'
# icon PRs each declare the version bump they want (patch for tweaks, minor for
# new icons). Those changesets then batch into a single release when the
# "Version Packages" PR is merged.
#
# Override with the `release:none` label for intentionally docs/tooling-only
# PRs that should not produce a release.
#
# Version Packages PRs (opened by the Changesets bot) are skipped — their whole
# purpose is to *consume* changesets, so they never carry one of their own. The
# bot's PRs always come from a branch named "changeset-release/<base>".

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    name: Verify changeset present
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.pull_request.labels.*.name, 'release:none') &&
      !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changeset is present
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
